<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ "/" | relURL }}">{{ site.Title }}</a>
    <nav class="site-nav" aria-label="主导航">
      {{ range $id, $s := hugo.Data.sections }}
        <a href="{{ printf "/%s/" $id | relURL }}"{{ if eq $.Section $id }} class="active" aria-current="page"{{ end }}>{{ $s.title }}</a>
      {{ end }}
    </nav>
  </div>
</header>

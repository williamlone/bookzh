<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
    <nav class="site-nav" aria-label="主导航">
      {{ range $id, $s := hugo.Data.sections }}
        {{ $sec := site.GetPage (printf "/%s" $id) }}
        {{ with $sec }}
          <a href="{{ .RelPermalink }}"{{ if eq $.Section $id }} class="active" aria-current="page"{{ end }}>{{ $s.title }}</a>
        {{ end }}
      {{ end }}
    </nav>
  </div>
</header>
